services:
  - type: web
    name: polarops-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: BACKEND_CORS_ORIGINS
        value: "*" # Change this to your frontend URL later, e.g., https://your-frontend.vercel.app
